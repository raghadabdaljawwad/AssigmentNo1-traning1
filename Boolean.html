<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Boolean Logic Test</title>
</head>
<body>

  

  <script>
    function booleanLogic(x, y) {
      console.log("AND:", x && y);
      console.log("OR:", x || y);
      console.log("NOT x:", !x);
      
    }
    console.log(booleanLogic(true, false));
  </script>

</body>
</html>
