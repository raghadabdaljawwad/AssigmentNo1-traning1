<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Count Occurrences</title>
</head>
<body>

<script>
  function countOccurrences(arr, value) {
    let count = 0;
    for (let i = 0; i < arr.length; i++) {
      if (arr[i] === value) {
        count++;
      }
    }
    return count;
  }

  console.log(countOccurrences([1, 2, 2, 3, 2, 4], 2)); 
</script>

</body>
</html>
