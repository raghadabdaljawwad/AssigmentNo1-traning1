
<!DOCTYPE html>

  <title>Challenge 7</title>
</head>
<body>
  <script>
    function checkValue(val) {
      if (val === null) return "Value is null";
      else if (val === undefined) return "Value is undefined";
      else return "Value is: " + val;
    }

    console.log(checkValue(null));
    console.log(checkValue(undefined));
    console.log(checkValue("Hello"));
  </script>
</body>
