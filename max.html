<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Find Max Value</title>
</head>
<body>

<script>
  function findMax(arr) {
    let max = arr[0];
    for (let i = 1; i < arr.length; i++) {
      if (arr[i] > max) {
        max = arr[i];
      }
    }
    return max;
  }

  console.log(findMax([3, 1, 9, 5, 6])); 
</script>

</body>
</html>
