<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Create User Object</title>
</head>
<body>

<script>
  function createUser(name, age, profession) {
    return {
      name: name,
      age: age,
      profession: profession
    };
  }

  console.log(createUser("Alice", 30, "Engineer"));
</script>

</body>
</html>
