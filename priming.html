<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Check Prime Number</title>
</head>
<body>

<script>
  function isPrime(num) {
    if (num <= 1) return false;
    for (let i = 2; i < num; i++) {
      if (num % i === 0) return false;
    }
    return true;
  }

  console.log(isPrime(11)); 
  console.log(isPrime(4)); 
</script>

</body>
</html>
