
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Challenge 11</title>
</head>
<body>
  <script>
    function checkNumber(n) {
      if (n > 0) console.log("Positive");
      else if (n < 0) console.log("Negative");
      else console.log("Zero");
    }

    checkNumber(5);
    checkNumber(-2);
    checkNumber(0);
  </script>
</body>
