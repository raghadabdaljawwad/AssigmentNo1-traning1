<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Check Age Challenge</title>
</head>
<body>

  <h2>Check Age Challenge</h2>
  <button onclick="runAgeChecks()">Run Age Checks</button>

  <script>
    function checkAge(age) {
      if (typeof age !== 'number' || isNaN(age) || age < 0) {
        console.log("Invalid age input");
      } else if (age >= 18) {
        console.log("Eligible to vote");
      } else {
        console.log("Not eligible to vote");
      }
    }

    function runAgeChecks() {
      checkAge(20);     
      checkAge(15);    
      checkAge(-5);     
      checkAge("abc");  
      checkAge(NaN);    
    }
  </script>

</body>
</html>
