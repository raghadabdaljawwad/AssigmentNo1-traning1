<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Multiplication Table</title>
</head>
<body>

<script>
  function printMultiplicationTable(num) {
    for (let i = 1; i <= 10; i++) {
      console.log(`${num} x ${i} = ${num * i}`);
    }
  }

  printMultiplicationTable(7);
</script>

</body>
</html>
